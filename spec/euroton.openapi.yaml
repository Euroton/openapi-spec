        Bridge to ship client-side telemetry. Source:
        go-proton-api/server/router.go

        routes this to `handleObservabilityPost`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Name:
                  type: string
                Version:
                  type: integer
                Timestamp:
                  type: integer
                  description: Unix timestamp
                Data: {}
              required:
                - Name
                - Version
                - Timestamp
      responses:
        "200":
          description: Successful response. Response schema not yet extracted.
  /vpn/v1/certificate/all:
    get:
      operationId: Vpn_listCertificates
      tags:
        - Vpn
      summary: List WireGuard device certificates
      description: |
        Session-gated. VPN is out of scope, so no certificates are ever issued —
        the list is always empty and `Total` is 0 regardless of paging/filter
        params (which are accepted and ignored).
      parameters:
        - name: Offset
          in: query
          required: false
          schema:
            type: integer
        - name: Limit
          in: query
          required: false
          schema:
            type: integer
        - name: Mode
          in: query
          required: false
          schema:
            type: string
            enum:
              - session
              - persistent
        - name: Sort
          in: query
          required: false
          schema:
            type: string
        - name: Desc
          in: query
          required: false
          schema:
            type: integer
            enum:
              - 0
              - 1
        - name: WithSessions
          in: query
          required: false
          schema:
            type: integer
            enum:
              - 0
              - 1
        - name: BeginID
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Certificate list (always empty while VPN is deferred).
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 1000
                  Total:
                    type: integer
                    example: 0
                  Certificates:
                    type: array
                    items:
                      type: object
                      properties:
                        SerialNumber:
                          type: string
                        ClientKeyFingerprint:
                          type: string
                        ClientKey:
                          type: string
                        Certificate:
                          type: string
                        ExpirationTime:
                          type: integer
                          description: Unix seconds
                        RefreshTime:
                          type: integer
                          description: Unix seconds
                        Mode:
                          type: string
                          enum:
                            - session
                            - persistent
                        ServerPublicKeyMode:
                          type: string
                          enum:
                            - EC
                            - RSA
                        ServerPublicKey:
                          type: string
                        DeviceName:
                          type: string
                        Features:
                          type: object
                          additionalProperties: true
                      required:
                        - SerialNumber
                        - ClientKeyFingerprint
                        - ClientKey
                        - Certificate
                        - ExpirationTime
                        - RefreshTime
                        - Mode
                        - ServerPublicKeyMode
                        - ServerPublicKey
                required:
                  - Code
                  - Certificates
  /vpn/v2/clientconfig:
    get:
      operationId: Vpn_getClientConfig
      tags:
        - Vpn
      summary: VPN client config (feature flags)
      description: >
        Intentionally public (no session gate) — Proton's VPN app can bootstrap

        clientconfig before login. The client reads only `FeatureFlags`; while
        VPN

        is deferred all ten flags are `false` so every VPN feature stays hidden.

        `DefaultPorts`/`ServerRefreshInterval` are returned for completeness but

        are not read by the client.
      responses:
        "200":
          description: Inert client config with all feature flags disabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 1000
                  ServerRefreshInterval:
                    type: integer
                    example: 90
                  DefaultPorts:
                    type: object
                    additionalProperties: true
                  FeatureFlags:
                    type: object
                    properties:
                      NetShield:
                        type: boolean
                      GuestHoles:
                        type: boolean
                      ServerRefresh:
                        type: boolean
                      StreamingServicesLogos:
                        type: boolean
                      PortForwarding:
                        type: boolean
                      ModerateNAT:
                        type: boolean
                      SafeMode:
                        type: boolean
                      PollNotificationAPI:
                        type: boolean
                      VpnAccelerator:
                        type: boolean
                      SmartReconnect:
                        type: boolean
                required:
                  - Code
                  - FeatureFlags
components:
  schemas: {}
